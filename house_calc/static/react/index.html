    <style>
      /* Base background matches Qurilish Bazasi before React mounts — no flash. */
      html { background: #000000; }
      body { background: #000000; margin: 0; }
    </style>
    <script>
      /* Resolve theme before first paint so the dark canvas is applied immediately. */
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark;
          if (t === 'light') dark = false;
          else if (t === 'dark' || t === null || t === '') dark = true; /* unified dark default */
          else dark = window.matchMedia('(prefers-color-scheme: dark)').matches; /* 'system' */
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
